name: CI

on:
  push:
    branches: ["main", "feat/**", "fix/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: "Test (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install core dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check . --select=E,F,W --ignore=E501 --exclude=__pycache__
        continue-on-error: true

      - name: Run unit tests + L2 skill validation
        run: |
          pytest tests/ -q --tb=short \
            -m "not slow" \
            --ignore=tests/test_rdkit_enum.py

      - name: Validate L2 skill files (standalone)
        run: python tools/eval/l2_validator.py

  skill-lint:
    name: "L2 skill lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install core dependencies
        run: pip install -e ".[dev]"

      - name: Validate all L2 skill files
        run: python -m pytest tests/test_l2_skills.py -v
